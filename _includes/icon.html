{%- comment -%}Research-card icon. Usage: {% include icon.html name="lattice" %}{%- endcomment -%}
{% if include.name == "lattice" %}<svg width="72" height="52" viewBox="0 0 72 52" aria-hidden="true">
            <g class="ic-faint" stroke-width="2">
              <rect x="6" y="6" width="13" height="13"/><rect x="19" y="6" width="13" height="13"/><rect x="32" y="6" width="13" height="13"/><rect x="45" y="6" width="13" height="13"/>
              <rect x="6" y="19" width="13" height="13"/><rect x="19" y="19" width="13" height="13"/><rect x="32" y="19" width="13" height="13"/><rect x="45" y="19" width="13" height="13"/>

            <path class="ic-rline" d="M6 25.5 H58" stroke-width="3"/>

              <path d="M56 25 C 66 25, 70 40, 84 40"/>

            <circle class="dv-g" cx="26" cy="25" r="7" stroke-width="1.8"/>
            <circle class="dv-r" cx="52" cy="25" r="7" stroke-width="1.8"/>
          </svg>
{% elsif include.name == "brackets" %}<svg width="86" height="52" viewBox="0 0 86 52" aria-hidden="true">
            <g class="ic-g" stroke-width="2.4" stroke-linecap="round">
              <path d="M14 6 H7 V46 H14"/><path d="M22 6 H15 V46 H22"/>

{% elsif include.name == "phasespace" %}<svg width="86" height="52" viewBox="0 0 86 52" aria-hidden="true">
            <ellipse class="dv-wire" cx="43" cy="26" rx="30" ry="14" stroke-width="2.4" transform="rotate(-18 43 26)"/>
