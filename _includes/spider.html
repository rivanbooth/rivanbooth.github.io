{%- comment -%}
Small ZX spider used as a section-heading ornament.
Usage: {% include spider.html colour="green" %}   (green | red | both)
{%- endcomment -%}
{%- if include.colour == "both" -%}
<svg class="spider" width="42" height="22" viewBox="0 0 42 22" aria-hidden="true"><line class="sp-w" x1="2" y1="11" x2="40" y2="11"/><circle class="sp-g" cx="13" cy="11" r="5.5"/><circle class="sp-r" cx="29" cy="11" r="5.5"/></svg>
{%- else -%}
<svg class="spider" width="30" height="22" viewBox="0 0 30 22" aria-hidden="true"><line class="sp-w" x1="2" y1="11" x2="28" y2="11"/><circle class="{% if include.colour == 'red' %}sp-r{% else %}sp-g{% endif %}" cx="15" cy="11" r="6"/></svg>
{%- endif -%}
