title: Robert I. Booth
tagline: Research Associate in Quantum Software
description: >-
  Robert I. Booth is a researcher in quantum computation at the University of
  Oxford, working on fault-tolerant quantum compilation, graphical and algebraic
  calculi, and the semantics of quantum programming languages.

url: "https://robertbooth.fr"
affiliation: Quantum Group · University of Oxford

intro: >-
  I work on the mathematical foundations of fault-tolerance which are needed
  to compile computations into reliable error-corrected implementations on
  quantum computers.

# Contact block
contact:
  lines:
    - Quantum Group
    - Department of Computer Science
    - University of Oxford
  # Email is assembled in JavaScript so scrapers don't get it plain.
  email_user: robert.booth
  email_domain: cs.ox.ac.uk

cv: pdfs/CV.pdf

links:
  - { name: Google Scholar, url: "https://scholar.google.com/citations?user=YMsAJG8AAAAJ" }
  - { name: ORCiD,          url: "https://orcid.org/0000-0002-1146-3380" }
  - { name: arXiv,          url: "https://arxiv.org/search/?searchtype=author&query=Booth%2C+R+I" }

# Random photo pool. 'credit' is optional — omit it and no credit is shown.
photos:
